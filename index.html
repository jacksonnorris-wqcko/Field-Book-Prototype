<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171d1a;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

#home{align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0,#eef1ed,#dfe2de 55%,#d3d7d3)}
.launch{width:min(520px,100%);background:#fbfaf7;border:1px solid #d7dad6;border-radius:24px;box-shadow:0 22px 60px #17201d22;overflow:hidden}.launch-top{height:7px;background:linear-gradient(90deg,#1e4d3e,#2c6855,#a88955)}.launch-body{padding:42px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.logo{width:54px;height:54px;border-radius:15px;background:#17201d;display:grid;place-items:center;margin:18px 0 22px}.logo svg{width:40px;height:40px;display:block}.launch h1{font-size:38px;letter-spacing:-1.4px;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 30px;line-height:1.5}.launch-btn{width:100%;height:54px;border:1px solid #ddd9d0;border-radius:13px;background:#fff;text-align:left;padding:0 17px;margin-top:10px;font-weight:700;color:var(--ink)}.launch-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.launch-btn span{float:right;opacity:.6}.version{margin-top:30px;color:#969e99;font-size:10px;text-align:center;letter-spacing:1.2px}
#jobs{background:#f2f3f0;flex-direction:column}.topbar{height:70px;background:#fff;border-bottom:1px solid #ddd9d0;display:flex;align-items:center;padding:0 max(18px,calc((100% - 820px)/2))}.topbar button{border:0;background:transparent;color:var(--muted);font-weight:700}.topbar h2{margin:auto;font-size:16px}.top-spacer{width:45px}.jobs-content{width:min(820px,100%);margin:auto;padding:28px 20px 50px}.jobs-title{font-size:30px;letter-spacing:-.8px;margin:0 0 5px}.jobs-sub{color:var(--muted);margin:0 0 22px}.new-job{border:0;border-radius:13px;background:var(--ink);color:#fff;padding:14px 17px;font-weight:750;margin-bottom:18px}.job{background:#fff;border:1px solid #ddd9d0;border-radius:16px;padding:17px 18px;margin:9px 0;box-shadow:0 5px 18px #17201d0a}.job-main{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.job-no{font-size:10px;font-weight:800;letter-spacing:1.2px;color:var(--accent);margin-bottom:4px}.job-name{font-size:17px;font-weight:750}.job-site{font-size:13px;color:var(--muted);margin-top:5px}.open-job{border:1px solid #ddd9d0;background:#fff;border-radius:10px;padding:9px 11px;font-weight:700}.empty{padding:45px 10px;text-align:center;color:var(--muted)}
#book{background:#171d1a;flex-direction:column;position:relative}.bookbar{height:calc(54px + env(safe-area-inset-top));flex:none;background:#111614;color:#fff;display:flex;align-items:center;padding:env(safe-area-inset-top) 12px 0;gap:10px;border-bottom:1px solid #303934;z-index:10}.bookbar button{border:0;background:#202925;color:#e9eeeb;border-radius:9px;padding:8px 11px;font-weight:700}.bookbar .center{flex:1;text-align:center;min-width:0}.jobid{font-size:9px;color:#98aaa2;letter-spacing:1.4px;font-weight:800}.jobtitle{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.canvas-wrap{position:relative;flex:1;overflow:hidden;background:#cfd2ce}.paper{position:absolute;inset:0;background:var(--paper);overflow:hidden;background-image:linear-gradient(rgba(222,219,211,.42) 1px,transparent 1px);background-size:100% 34px}.paper:before{content:"";position:absolute;top:0;bottom:0;left:54px;border-left:1px solid #d8a49d;opacity:.55;pointer-events:none}#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.paper-title{position:absolute;top:17px;left:78px;right:20px;pointer-events:none;z-index:2}.paper-title strong{font-size:14px}.paper-title span{font-size:10px;color:#9a9f9c;margin-left:8px}
.tools-toggle{position:absolute;right:28px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:8;width:54px;height:54px;border:1px solid #39443e;border-radius:17px;background:#202824;color:#fff;box-shadow:0 10px 28px #0005;font-size:21px;display:grid;place-items:center}
.tool-panel{position:absolute;right:28px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:7;width:min(286px,calc(100% - 32px));background:#202824;color:#fff;border:1px solid #3a443f;border-radius:17px;padding:12px;box-shadow:0 18px 42px #0007;display:none}.tool-panel.open{display:block}.tool-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tool{border:1px solid #3a443f;background:#27302c;color:#eef2ef;border-radius:12px;padding:11px 5px 10px;font-size:11px;font-weight:750;min-height:62px}.tool.active{background:var(--accent);border-color:#4b8a74;box-shadow:inset 0 0 0 1px #ffffff18}.tool b{display:block;font-size:18px;margin-bottom:4px}.tool-wide{margin-top:9px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tool-wide button{border:1px solid #3a443f;background:#252d29;color:#eef2ef;border-radius:10px;padding:9px 6px;font-size:10px;font-weight:750}.tool-help{font-size:10px;color:#9eaaa4;margin:9px 3px 2px;line-height:1.4}.text-editor{position:absolute;z-index:20;background:#fff;border:1px solid #ccc;border-radius:10px;box-shadow:0 10px 30px #0003;padding:7px;display:none}.text-editor input{border:0;outline:0;width:190px;height:34px;padding:0 7px}.text-editor button{border:0;background:var(--accent);color:#fff;border-radius:7px;height:34px;padding:0 9px}

position:absolute;z-index:21;display:none;align-items:center;gap:5px;
background:#202824;color:#fff;border:1px solid #3a443f;border-radius:10px;
padding:5px;box-shadow:0 10px 28px #0005;transform:translate(-50%,-100%);
}

.modal{display:none;position:fixed;inset:0;background:#090d0b8c;z-index:30;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{width:min(500px,100%);background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 25px 70px #0005}.dialog h2{margin:0 0 20px;font-size:22px}.field{margin:12px 0}.field label{display:block;font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:800;margin-bottom:6px}.field input{width:100%;height:44px;border:1px solid #ddd9d0;border-radius:10px;padding:0 12px;background:#fff}.actions{display:flex;gap:9px;margin-top:20px}.actions button{flex:1;height:44px;border:1px solid #ddd9d0;border-radius:10px;background:#fff;font-weight:700}.actions .save{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:600px){.paper:before{left:38px}.paper-title{left:55px}.tools-toggle{right:20px;bottom:calc(20px + env(safe-area-inset-bottom))}.tool-panel{right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:min(280px,calc(100% - 40px))}}

<body>
<section id="home" class="screen active"><div class="launch"><div class="launch-top"></div><div class="launch-body"><div class="eyebrow">Survey Field System</div><div class="logo" aria-label="Field Book logo">
<svg viewBox="0 0 180 180" aria-hidden="true">
<polygon points="55,75 82,90 82,78 126,103 126,116 88,94 88,108 55,88" fill="#fbfaf7"/>
</svg>
</div><h1>Field Book</h1><p class="lead">A clean digital field book for recording survey observations in the field.</p><button class="launch-btn primary" onclick="newJob()">Create New Job <span>→</span></button><button class="launch-btn" onclick="showJobs()">Job Storage <span>→</span></button><div class="version">FIELD BOOK v0.0.16</div></div></div></section>
<section id="jobs" class="screen"><div class="topbar"><button onclick="home()">← Back</button><h2>Job Storage</h2><div class="top-spacer"></div></div><div class="jobs-content"><h1 class="jobs-title">Jobs</h1><p class="jobs-sub">Your field books and survey projects.</p><button class="new-job" onclick="newJob()">＋ Create New Job</button><div id="jobList"></div></div></section>
<section id="book" class="screen"><div class="bookbar"><button onclick="showJobs()">Jobs</button><div class="center"><div class="jobid" id="toolbarJob"></div><div class="jobtitle" id="toolbarTitle"></div></div><button onclick="jobDetails()">Info</button></div><div class="canvas-wrap"><div class="paper" id="paper"><div class="paper-title"><strong id="paperTitle"></strong><span id="paperSite"></span></div><canvas id="drawCanvas"></canvas><div class="text-editor" id="textEditor"><input id="textInput" placeholder="Text…"><button onclick="placeText()">Add</button></div><div class="text-selection" id="textSelection"><button onclick="rotateSelected(-15)">↺</button><span>MOVE / ROTATE</span><button onclick="rotateSelected(15)">↻</button></div></div><button class="tools-toggle" onclick="toggleTools()" aria-label="Drawing tools">✎</button><div class="tool-panel" id="toolPanel"><div class="tool-row"><button class="tool" data-tool="pen" onclick="setTool('pen')"><b>✎</b>Pen</button><button class="tool" data-tool="line" onclick="setTool('line')"><b>╱</b>Line</button><button class="tool" data-tool="arc" onclick="setTool('arc')"><b>⌒</b>Arc</button><button class="tool" data-tool="text" onclick="setTool('text')"><b>T</b>Text</button><button class="tool" data-tool="move" onclick="setTool('move')"><b>↔</b>Move</button><button class="tool" data-tool="eraser" onclick="setTool('eraser')"><b>⌫</b>Erase</button><button class="tool" onclick="undo()"><b>↶</b>Undo</button></div><div class="tool-wide"><button onclick="finishLine()">Finish line</button><button onclick="clearDrawing()">Clear</button><button onclick="toggleTools()">Done</button></div><div class="tool-help" id="toolHelp">Select a tool to start. Nothing is selected when the tools open.</div></div></div></section>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const APP_VERSION='0.0.16',KEY='fieldBook.v006';let db=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"active":null}');const $=id=>document.getElementById(id);let canvas,ctx,tool='none',drawing=false,start=null,current=null,preview=null,textPoint=null,lineStart=null,lineOrigin=null,lastLineTap=0,lastLinePoint=null,arcStart=null,arcEnd=null,selectedText=null,moveOffset=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function home(){show('home')}function showJobs(){renderJobs();show('jobs')}function nextJob(){let n=db.jobs.map(j=>parseInt(String(j.number).split('-').pop())).filter(Number.isFinite);return '26-'+String((Math.max(0,...n)+1)).padStart(4,'0')}function openModal(){$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function newJob(){$('dialog').innerHTML=`<h2>Create New Job</h2><div class="field"><label>JOB NUMBER</label><input id="jn" value="${nextJob()}"></div><div class="field"><label>JOB NAME</label><input id="jname" placeholder="Boundary Survey"></div><div class="field"><label>SITE / ADDRESS</label><input id="jsite" placeholder="Optional"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="createJob()">Create Job</button></div>`;openModal();setTimeout(()=>$('jname').focus(),50)}
function createJob(){let j={id:uid(),number:$('jn').value.trim()||nextJob(),name:$('jname').value.trim()||'Untitled Survey',site:$('jsite').value.trim(),created:new Date().toISOString(),notes:[],drawing:[]};db.jobs.unshift(j);db.active=j.id;save();closeModal();openBook()}
function renderJobs(){$('jobList').innerHTML=db.jobs.map(j=>`<article class="job"><div class="job-main"><div><div class="job-no">${esc(j.number)}</div><div class="job-name">${esc(j.name)}</div><div class="job-site">${esc(j.site||'No site entered')} · ${j.notes.length} note${j.notes.length===1?'':'s'}</div></div><button class="open-job" onclick="openBook('${j.id}')">Open →</button></div></article>`).join('')||'<div class="empty">No jobs stored yet.</div>'}function active(){return db.jobs.find(j=>j.id===db.active)}function openBook(id){if(id)db.active=id;save();show('book');setTimeout(initCanvas,30);renderBook()}function renderBook(){let j=active();if(!j)return home();$('toolbarJob').textContent=j.number;$('toolbarTitle').textContent=j.name;$('paperTitle').textContent=j.name;$('paperSite').textContent=j.site||'';resizeCanvas();drawAll()}
function initCanvas(){canvas=$('drawCanvas');ctx=canvas.getContext('2d');resizeCanvas();drawAll();canvas.onpointerdown=pointerDown;canvas.onpointermove=pointerMove;canvas.onpointerup=pointerUp;canvas.onpointercancel=pointerUp}
function resizeCanvas(){if(!canvas)return;let r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);drawAll()}window.addEventListener('resize',()=>{if($('book').classList.contains('active'))resizeCanvas()})
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function styleCtx(){ctx.strokeStyle='#202824';ctx.fillStyle='#202824';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round'}
function drawAll(extra=null){if(!ctx||!canvas)return;styleCtx();ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);let j=active();if(!j)return;(j.drawing||[]).forEach(drawItem);if(extra)drawItem(extra)}
function drawItem(o){
 styleCtx();

 if(o.type==='linePreviewPoint'||o.type==='arcPreviewPoint'){
   ctx.fillStyle='#2c6855';
   ctx.beginPath();ctx.arc(o.x,o.y,5,0,Math.PI*2);ctx.fill();
   return;
 }

 if(o.type==='arcPreviewRadius'){
   styleCtx();
   ctx.setLineDash([5,5]);
   ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();
   ctx.setLineDash([]);
   ctx.fillStyle='#2c6855';
   ctx.beginPath();ctx.arc(o.x1,o.y1,5,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(o.x2,o.y2,5,0,Math.PI*2);ctx.fill();
   return;
 }

 if(o.type==='arcPreview'){
   styleCtx();ctx.setLineDash([5,5]);ctx.beginPath();
   ctx.moveTo(o.x1,o.y1);ctx.quadraticCurveTo(o.cx,o.cy,o.x2,o.y2);ctx.stroke();
   ctx.setLineDash([]);
   ctx.fillStyle='#2c6855';
   ctx.beginPath();ctx.arc(o.x1,o.y1,5,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(o.x2,o.y2,5,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(o.cx,o.cy,5,0,Math.PI*2);ctx.fill();
   return;
 }

 if(o.type==='pen'||o.type==='line'||o.type==='arc'){
  ctx.beginPath();
  if(o.type==='pen'){let p=o.points||[];if(!p.length)return;ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y)}
  if(o.type==='line'){ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2)}
  if(o.type==='arc'){ctx.moveTo(o.x1,o.y1);ctx.quadraticCurveTo(o.cx,o.cy,o.x2,o.y2)}
  ctx.stroke();
 }

 if(o.type==='text'){
   ctx.save();
   ctx.translate(o.x,o.y);
   ctx.rotate((o.rotation||0)*Math.PI/180);
   ctx.font='16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
   ctx.fillStyle='#202824';
   ctx.fillText(o.text,0,0);
   if(o===selectedText){
     const w=ctx.measureText(o.text).width;
     ctx.strokeStyle='#2c6855';ctx.lineWidth=1;ctx.setLineDash([4,3]);
     ctx.strokeRect(-4,-19,w+8,24);ctx.setLineDash([]);
   }
   ctx.restore();
 }
}

function makeArcPreview(mid){
 if(!arcStart||!arcEnd||!mid)return null;
 const dx=arcEnd.x-arcStart.x,dy=arcEnd.y-arcStart.y;
 const len=Math.hypot(dx,dy)||1;
 const mx=(arcStart.x+arcEnd.x)/2,my=(arcStart.y+arcEnd.y)/2;
 const nx=-dy/len,ny=dx/len;
 const bulge=(mid.x-mx)*nx+(mid.y-my)*ny;
 return {type:'arcPreview',x1:arcStart.x,y1:arcStart.y,x2:arcEnd.x,y2:arcEnd.y,cx:mx+nx*bulge,cy:my+ny*bulge};
}
function pointerDown(e){
 const p=point(e);

 if(tool==='text'){
   textPoint=p;
   openTextEditor(textPoint);
   return;
 }

 if(tool==='move'){
   const hit=findTextAt(p);
   if(hit){
     selectedText=hit;
     moveOffset={x:p.x-hit.x,y:p.y-hit.y};
     showTextSelection(hit);
     drawing=true;
     canvas.setPointerCapture?.(e.pointerId);
   }else{
     selectedText=null;
     hideTextSelection();
     drawing=false;
   }
   return;
 }

 if(tool==='line'){
   const now=Date.now();
   const isDouble=(now-lastLineTap<360 && lastLinePoint &&
      Math.hypot(p.x-lastLinePoint.x,p.y-lastLinePoint.y)<28);

   if(!lineStart){
     lineStart=p;
     lineOrigin={x:p.x,y:p.y};
     lastLineTap=now;
     lastLinePoint={x:p.x,y:p.y};
     drawAll({type:'linePreviewPoint',x:p.x,y:p.y});
     return;
   }

   const j=active();

   if(isDouble){
     j.drawing.push({type:'line',x1:lineStart.x,y1:lineStart.y,x2:p.x,y2:p.y});
     if(Math.hypot(p.x-lineOrigin.x,p.y-lineOrigin.y)>1){
       j.drawing.push({type:'line',x1:p.x,y1:p.y,x2:lineOrigin.x,y2:lineOrigin.y});
     }
     lineStart=null;lineOrigin=null;lastLineTap=0;lastLinePoint=null;
     save();drawAll();return;
   }

   j.drawing.push({type:'line',x1:lineStart.x,y1:lineStart.y,x2:p.x,y2:p.y});
   lineStart=p;lastLineTap=now;lastLinePoint={x:p.x,y:p.y};
   save();drawAll({type:'linePreviewPoint',x:p.x,y:p.y});return;
 }

 if(tool==='arc'){
   if(!arcStart){
     arcStart=p;
     drawAll({type:'arcPreviewPoint',x:p.x,y:p.y});
     return;
   }
   if(!arcEnd){
     arcEnd=p;
     drawAll({type:'arcPreviewRadius',x1:arcStart.x,y1:arcStart.y,x2:p.x,y2:p.y});
     return;
   }
   drawing=true;
   current=p;
   start=arcStart;
   canvas.setPointerCapture?.(e.pointerId);
   drawAll(makeArcPreview(p));
   return;
 }

 drawing=true;start=p;current=start;
 if(tool==='pen')preview={type:'pen',points:[start]};
 if(tool==='eraser'){eraseAt(start);drawing=false;return}
 canvas.setPointerCapture?.(e.pointerId);drawAll(preview);
}
function pointerMove(e){
 const p=point(e);

 if(tool==='move'&&drawing&&selectedText){
   selectedText.x=p.x-(moveOffset?.x||0);
   selectedText.y=p.y-(moveOffset?.y||0);
   showTextSelection(selectedText);
   drawAll();
   return;
 }

 if(tool==='arc'&&arcStart&&arcEnd){
   if(drawing){
     current=p;
     drawAll(makeArcPreview(p));
   }else{
     drawAll({type:'arcPreviewRadius',x1:arcStart.x,y1:arcStart.y,x2:arcEnd.x,y2:arcEnd.y});
   }
   return;
 }

 if(!drawing)return;
 current=p;
 if(tool==='pen'){preview.points.push(current);drawAll(preview)}
 else if(tool==='eraser'){eraseAt(current)}
}
function pointerUp(){
 if(tool==='move'){
   if(drawing){drawing=false;save();showTextSelection(selectedText)}
   return;
 }
 if(tool==='arc'&&drawing){
   const j=active();
   if(arcStart&&arcEnd){
     const item=makeArcPreview(current);
     if(item)j.drawing.push(item);
   }
   drawing=false;arcStart=null;arcEnd=null;start=null;current=null;save();drawAll();return;
 }
 if(!drawing)return;
 drawing=false;
 let j=active();if(!j)return;
 if(tool==='pen'&&preview?.points?.length>1)j.drawing.push(preview);
 preview=null;current=null;save();drawAll();
}
function eraseAt(p){let j=active();if(!j)return;j.drawing=(j.drawing||[]).filter(o=>!nearItem(o,p,18));save();drawAll()}
function nearItem(o,p,r){
 if(o.type==='text')return Math.hypot(o.x-p.x,o.y-p.y)<r+20;
 if(o.type==='pen')return o.points.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<r);
 if(o.type==='line')return pointToSegmentDistance(p,{x:o.x1,y:o.y1},{x:o.x2,y:o.y2})<r;
 if(o.type==='arc')return pointToSegmentDistance(p,{x:o.x1,y:o.y1},{x:o.x2,y:o.y2})<r+8;
 return false;
}
function pointToSegmentDistance(p,a,b){
 const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
 if(!len2)return Math.hypot(p.x-a.x,p.y-a.y);
 let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;t=Math.max(0,Math.min(1,t));
 return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function undo(){let j=active();if(!j)return;j.drawing.pop();save();drawAll()}
function clearDrawing(){if(confirm('Clear the field sketch?')){let j=active();j.drawing=[];lineStart=null;lineOrigin=null;lastLineTap=0;lastLinePoint=null;arcStart=null;arcEnd=null;selectedText=null;hideTextSelection();save();drawAll()}}
function finishLine(){if(tool==='line'){lineStart=null;lineOrigin=null;lastLineTap=0;lastLinePoint=null;drawAll()}}
function toggleTools(){
 const panel=$('toolPanel');panel.classList.toggle('open');
 if(!panel.classList.contains('open')){lineStart=null;lineOrigin=null;lastLineTap=0;lastLinePoint=null;drawAll()}
}
function setTool(t){
 if(tool==='line'&&t!=='line')lineStart=null;
 tool=t;
 document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
 $('textEditor').style.display='none';
 const help={
   none:'Select a tool to start. Nothing is selected when the tools open.',
   pen:'Draw freehand directly on the field page.',
   line:'Tap A, then tap each next point. Double-tap the last point to close back to A.',
   arc:'Tap the start, tap the end, then drag the middle out to set the radius.',
   text:'Tap anywhere on the page to place a text label.',
   move:'Tap a text label, then drag it. Use ↺ / ↻ to rotate it.',
   eraser:'Tap or drag over a drawing to erase it.'
 };
 $('toolHelp').textContent=help[t]||help.none;

 // Selecting a tool is the action; close the tool tray immediately.
 $('toolPanel').classList.remove('open');
 if(t!=='move'){selectedText=null;hideTextSelection();}

 if(t!=='line')drawAll();
}
function openTextEditor(p){textPoint=p;let ed=$('textEditor');ed.style.left=Math.min(p.x,canvas.clientWidth-220)+'px';ed.style.top=Math.min(p.y,canvas.clientHeight-55)+'px';ed.style.display='flex';$('textInput').value='';setTimeout(()=>$('textInput').focus(),20)}
function placeText(){let v=$('textInput').value.trim();if(!v)return;let j=active();j.drawing.push({type:'text',text:v,x:textPoint.x,y:textPoint.y,rotation:0});save();$('textEditor').style.display='none';drawAll()}$('textInput').addEventListener('keydown',e=>{if(e.key==='Enter')placeText();if(e.key==='Escape')$('textEditor').style.display='none'})
function findTextAt(p){
 const j=active();if(!j)return null;
 for(let i=j.drawing.length-1;i>=0;i--){
   const o=j.drawing[i];
   if(o.type!=='text')continue;
   const w=Math.max(28,ctx.measureText(o.text).width);
   const dx=p.x-o.x,dy=p.y-o.y,ang=-(o.rotation||0)*Math.PI/180;
   const x=dx*Math.cos(ang)-dy*Math.sin(ang),y=dx*Math.sin(ang)+dy*Math.cos(ang);
   if(x>=-8&&x<=w+8&&y>=-22&&y<=7)return o;
 }
 return null;
}
function showTextSelection(o){
 const el=$('textSelection');if(!o){hideTextSelection();return}
 el.style.display='flex';
 el.style.left=Math.max(80,Math.min(canvas.clientWidth-80,o.x))+'px';
 el.style.top=Math.max(50,o.y-12)+'px';
}
function hideTextSelection(){$('textSelection').style.display='none'}
function rotateSelected(deg){
 if(!selectedText)return;
 selectedText.rotation=(selectedText.rotation||0)+deg;
 save();showTextSelection(selectedText);drawAll();
}
function jobDetails(){let j=active();$('dialog').innerHTML=`<h2>Job Information</h2><div class="field"><label>JOB NUMBER</label><input value="${esc(j.number)}" disabled></div><div class="field"><label>JOB NAME</label><input id="dn" value="${esc(j.name)}"></div><div class="field"><label>SITE / ADDRESS</label><input id="ds" value="${esc(j.site)}"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="saveDetails()">Save</button></div>`;openModal()}function saveDetails(){let j=active();j.name=$('dn').value.trim()||'Untitled Survey';j.site=$('ds').value.trim();save();closeModal();renderBook()}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});renderJobs();
let updateReloading=false;
async function applyServiceWorkerUpdate(reg){
  if(reg.waiting){
    reg.waiting.postMessage({type:'SKIP_WAITING'});
    return true;
  }
  return false;
}
async function checkForUpdate(){
  if(!('serviceWorker' in navigator))return;
  try{
    // First ask the server for the current release, bypassing browser/CDN caches.
    const r=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});
    const remote=await r.json();

    if(remote.version && remote.version!==APP_VERSION){
      // A newer HTML is live. Ask the active worker to refresh its navigation
      // from the network, then reload into the new release.
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
      if(reg?.waiting){
        reg.waiting.postMessage({type:'SKIP_WAITING'});
      }else{
        updateReloading=true;
        location.reload();
      }
      return;
    }

    const reg=await navigator.serviceWorker.register('./sw.js?release='+APP_VERSION,{updateViaCache:'none'});
    await reg.update();
    await applyServiceWorkerUpdate(reg);
  }catch(e){
    // Offline/first-run: the normal cached app continues to work.
  }
}
navigator.serviceWorker?.addEventListener('controllerchange',()=>{
  if(updateReloading || !sessionStorage.getItem('fieldBookReloaded')){
    sessionStorage.setItem('fieldBookReloaded','1');
    location.reload();
  }
});
checkForUpdate();
setInterval(checkForUpdate,60000);
</script>
