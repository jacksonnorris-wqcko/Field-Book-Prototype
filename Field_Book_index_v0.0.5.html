<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Book">
<title>Field Book — v0.0.5</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ink:#17201d;--ink2:#26312d;--muted:#737c77;--paper:#fbfaf7;
  --paper2:#f3f1ec;--line:#ddd9d0;--accent:#2c6855;--accent2:#1e4d3e;
  --gold:#a88955;--shadow:0 18px 50px rgba(20,28,25,.12)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#dfe2de;color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.screen{display:none;min-height:100vh}.screen.active{display:flex}
#home{align-items:center;justify-content:center;padding:28px;
background:radial-gradient(circle at 50% 0,#eef1ed 0,#dfe2de 52%,#d3d7d3 100%)}
.launch{width:min(520px,100%);background:rgba(251,250,247,.96);border:1px solid rgba(23,32,29,.08);
border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.launch-top{height:8px;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--gold))}
.launch-body{padding:42px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.logo{width:54px;height:54px;border-radius:15px;background:var(--ink);display:grid;place-items:center;
color:#fff;font-size:25px;margin:18px 0 22px;box-shadow:0 8px 20px rgba(23,32,29,.16)}
h1{font-size:38px;letter-spacing:-1.4px;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 34px;line-height:1.5}
.launch-btn{width:100%;height:54px;border:1px solid var(--line);border-radius:13px;background:#fff;
text-align:left;padding:0 17px;margin-top:10px;font-weight:700;color:var(--ink)}
.launch-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.launch-btn span{float:right;color:inherit;opacity:.6}
.version{margin-top:30px;color:#a0a6a2;font-size:11px;text-align:center;letter-spacing:1px}

#jobs{background:#f2f3f0;flex-direction:column}
.topbar{height:70px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);
display:flex;align-items:center;padding:0 max(18px,calc((100% - 820px)/2));position:sticky;top:0;z-index:3}
.topbar .back{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px 0}
.topbar h2{margin:0 auto;font-size:16px;letter-spacing:-.2px}.top-spacer{width:45px}
.jobs-content{width:min(820px,100%);margin:auto;padding:28px 20px 50px}
.jobs-title{font-size:30px;letter-spacing:-.8px;margin:0 0 5px}.jobs-sub{color:var(--muted);margin:0 0 22px}
.new-job{border:0;border-radius:13px;background:var(--ink);color:#fff;padding:14px 17px;font-weight:750;margin-bottom:18px}
.job{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 18px;margin:9px 0;
box-shadow:0 5px 18px rgba(20,28,25,.04)}
.job-main{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.job-no{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--accent);margin-bottom:4px}
.job-name{font-size:17px;font-weight:750}.job-site{font-size:13px;color:var(--muted);margin-top:5px}
.open-job{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700;white-space:nowrap}
.empty{padding:45px 10px;text-align:center;color:var(--muted)}

#book{background:#171d1a;flex-direction:column}
.bookbar{height:62px;flex:none;background:#111614;color:#fff;display:flex;align-items:center;
padding:0 max(14px,calc((100% - 1120px)/2));gap:12px;border-bottom:1px solid #303934}
.bookbar button{border:0;background:#202925;color:#e9eeeb;border-radius:10px;padding:9px 12px;font-weight:700}
.bookbar .center{flex:1;text-align:center;min-width:0}.bookbar .jobid{font-size:10px;color:#98aaa2;letter-spacing:1.5px;font-weight:800}
.bookbar .jobtitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookarea{flex:1;display:flex;justify-content:center;overflow:auto;padding:22px 18px 90px}
.paper{
position:relative;width:min(1060px,100%);min-height:calc(100vh - 106px);
background:var(--paper);border-radius:5px;box-shadow:0 20px 55px rgba(0,0,0,.24);
overflow:hidden
}
.paper-head{padding:28px 34px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}
.paper-head h1{font-size:25px;letter-spacing:-.7px;margin:0}.paper-head p{font-size:13px;color:var(--muted);margin:7px 0 0}
.paper-meta{text-align:right;font-size:11px;color:var(--muted);line-height:1.7;min-width:160px}
.sheet{padding:0 34px 80px}
.section-label{font-size:10px;letter-spacing:1.5px;color:#8a918d;font-weight:800;padding:18px 0 8px;text-transform:uppercase}
.note-row{display:grid;grid-template-columns:42px 1fr 70px;min-height:42px;border-bottom:1px solid #ece9e2;align-items:start}
.note-no{font-size:11px;color:#a2a7a4;padding-top:13px}
.note-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:42px;white-space:pre-wrap}
.note-type{text-align:right;font-size:9px;letter-spacing:1px;color:#9a9f9c;padding-top:15px;font-weight:800}
.blank{color:#b2b6b3;font-family:inherit;font-style:italic;font-size:13px;padding:25px 0}
.addbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 32px));
display:flex;gap:8px;z-index:4}
.addbar button{flex:1;border:1px solid #45504a;background:#202925;color:#fff;border-radius:12px;
height:48px;font-weight:750;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.addbar .primary{background:var(--accent);border-color:var(--accent)}

.modal{display:none;position:fixed;inset:0;background:rgba(9,13,11,.55);z-index:10;
align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}
.dialog{width:min(500px,100%);background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 25px 70px #0005}
.dialog h2{margin:0 0 20px;font-size:22px}.field{margin:12px 0}.field label{display:block;font-size:10px;
letter-spacing:1px;color:var(--muted);font-weight:800;margin-bottom:6px}.field input{width:100%;height:44px;
border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}.actions{display:flex;gap:9px;margin-top:20px}
.actions button{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.actions .save{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:650px){
 #home{padding:16px}.launch-body{padding:32px 25px}.launch h1{font-size:34px}
 .bookarea{padding:0 0 80px}.paper{border-radius:0;min-height:calc(100vh - 62px);box-shadow:none}
 .paper-head{padding:23px 19px 18px}.paper-head h1{font-size:22px}.paper-meta{min-width:105px}
 .sheet{padding:0 19px 70px}.note-row{grid-template-columns:31px 1fr 54px}.note-text{font-size:13px}
}
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="launch">
    <div class="launch-top"></div>
    <div class="launch-body">
      <div class="eyebrow">Survey Field System</div>
      <div class="logo">⌁</div>
      <h1>Field Book</h1>
      <p class="lead">A clean digital field book for recording survey observations in the field.</p>
      <button class="launch-btn primary" onclick="newJob()">Create New Job <span>→</span></button>
      <button class="launch-btn" onclick="showJobs()">Job Storage <span>→</span></button>
      <div class="version">FIELD BOOK v0.0.5</div>
    </div>
  </div>
</section>

<section id="jobs" class="screen">
  <div class="topbar"><button class="back" onclick="home()">← Back</button><h2>Job Storage</h2><div class="top-spacer"></div></div>
  <div class="jobs-content">
    <h1 class="jobs-title">Jobs</h1><p class="jobs-sub">Your field books and survey projects.</p>
    <button class="new-job" onclick="newJob()">＋ Create New Job</button>
    <div id="jobList"></div>
  </div>
</section>

<section id="book" class="screen">
  <div class="bookbar">
    <button onclick="showJobs()">Jobs</button>
    <div class="center"><div class="jobid" id="toolbarJob"></div><div class="jobtitle" id="toolbarTitle"></div></div>
    <button onclick="jobDetails()">Info</button>
  </div>
  <div class="bookarea">
    <main class="paper">
      <header class="paper-head">
        <div><h1 id="bookTitle"></h1><p id="bookSite"></p></div>
        <div class="paper-meta" id="bookMeta"></div>
      </header>
      <div class="sheet">
        <div class="section-label">Field observations</div>
        <div id="notes"></div>
      </div>
    </main>
  </div>
  <div class="addbar"><button class="primary" onclick="addNote()">＋ Add Field Note</button><button onclick="jobDetails()">Job Info</button></div>
</section>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>

<script>
const VERSION='0.0.5',KEY='fieldBook.v002';
let db=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"active":null}');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function home(){show('home')}
function showJobs(){renderJobs();show('jobs')}
function nextJob(){let n=db.jobs.map(j=>parseInt(String(j.number).split('-').pop())).filter(Number.isFinite);return '26-'+String((Math.max(0,...n)+1)).padStart(4,'0')}
function openModal(){ $('modal').classList.add('show') } function closeModal(){ $('modal').classList.remove('show') }
function newJob(){
 $('dialog').innerHTML=`<h2>Create New Job</h2>
 <div class="field"><label>JOB NUMBER</label><input id="jn" value="${nextJob()}"></div>
 <div class="field"><label>JOB NAME</label><input id="jname" placeholder="Boundary Survey"></div>
 <div class="field"><label>SITE / ADDRESS</label><input id="jsite" placeholder="Optional"></div>
 <div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="createJob()">Create Job</button></div>`;
 openModal();setTimeout(()=>$('jname').focus(),50)
}
function createJob(){let j={id:uid(),number:$('jn').value.trim()||nextJob(),name:$('jname').value.trim()||'Untitled Survey',site:$('jsite').value.trim(),created:new Date().toISOString(),notes:[]};db.jobs.unshift(j);db.active=j.id;save();closeModal();openBook()}
function renderJobs(){
 $('jobList').innerHTML=db.jobs.map(j=>`<article class="job"><div class="job-main"><div><div class="job-no">${esc(j.number)}</div><div class="job-name">${esc(j.name)}</div><div class="job-site">${esc(j.site||'No site entered')} · ${j.notes.length} note${j.notes.length===1?'':'s'}</div></div><button class="open-job" onclick="openBook('${j.id}')">Open →</button></div></article>`).join('')||'<div class="empty">No jobs stored yet.</div>'
}
function active(){return db.jobs.find(j=>j.id===db.active)}
function openBook(id){if(id)db.active=id;save();renderBook();show('book')}
function renderBook(){
 let j=active();if(!j)return home();
 $('toolbarJob').textContent=j.number;$('toolbarTitle').textContent=j.name;
 $('bookTitle').textContent=j.name;$('bookSite').textContent=j.site||'No site entered';
 $('bookMeta').innerHTML=`JOB ${esc(j.number)}<br>${new Date(j.created).toLocaleDateString('en-AU')}<br>${j.notes.length} OBSERVATION${j.notes.length===1?'':'S'}<br><b>v${VERSION}</b>`;
 $('notes').innerHTML=j.notes.map((n,i)=>`<div class="note-row"><div class="note-no">${String(i+1).padStart(2,'0')}</div><div class="note-text">${esc(n.text)}</div><div class="note-type">${esc(n.type||'NOTE')}</div></div>`).join('')||'<div class="blank">No observations recorded. Add your first field note below.</div>'
}
function addNote(){
 $('dialog').innerHTML=`<h2>New Field Note</h2><div class="field"><label>OBSERVATION</label><input id="nt" autofocus placeholder="Enter field observation…"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="saveNote()">Add Note</button></div>`;
 openModal();setTimeout(()=>$('nt').focus(),50)
}
function saveNote(){let j=active(),v=$('nt').value.trim();if(!v)return;j.notes.push({id:uid(),text:v,type:'NOTE',time:new Date().toISOString()});save();closeModal();renderBook()}
function jobDetails(){
 let j=active();$('dialog').innerHTML=`<h2>Job Information</h2>
 <div class="field"><label>JOB NUMBER</label><input value="${esc(j.number)}" disabled></div>
 <div class="field"><label>JOB NAME</label><input id="dn" value="${esc(j.name)}"></div>
 <div class="field"><label>SITE / ADDRESS</label><input id="ds" value="${esc(j.site)}"></div>
 <div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="saveDetails()">Save</button></div>`;
 openModal()
}
function saveDetails(){let j=active();j.name=$('dn').value.trim()||'Untitled Survey';j.site=$('ds').value.trim();save();closeModal();renderBook()}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()})
renderJobs();
</script>
</body>
</html>
