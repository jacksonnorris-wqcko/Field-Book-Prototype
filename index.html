<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Field Book">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="field-book-version" content="0.0.3"><title>Field Book</title>
<style>
*{box-sizing:border-box}
:root{--paper:#f7f2e3;--paper2:#eee7d2;--ink:#252525;--muted:#777266;--line:#c9c0aa;--blue:#274c77;--red:#a43d32}
html,body{margin:0;height:100%;background:#d9d4c6;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}
.screen{display:none;min-height:100vh}.screen.active{display:flex}
#home{align-items:center;justify-content:center;padding:25px;background:#e1ddcf}
.cover{width:min(470px,94vw);background:var(--paper);border:1px solid #bcb4a1;box-shadow:0 12px 35px #0002;padding:42px 28px}
.cover:before{content:"";display:block;height:5px;background:var(--red);margin:-42px -28px 34px}
.title{font-size:42px;letter-spacing:-1px;margin:0 0 5px}.subtitle{font-size:15px;color:var(--muted);margin:0 0 36px;font-style:italic}
.cover-btn{display:block;width:100%;padding:17px 15px;margin:11px 0;background:transparent;border:1px solid #aaa18d;text-align:left;color:var(--ink);font-weight:bold}
.cover-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cover-footer{margin-top:40px;font-size:11px;color:#928c7e;text-align:center;letter-spacing:1px;text-transform:uppercase}
#jobs{background:#eeeae0;flex-direction:column}
.jobs-head{padding:20px max(18px,calc((100% - 720px)/2));border-bottom:1px solid #c8c1b3;background:#e8e3d7}
.jobs-head h1{margin:0;font-size:28px}.jobs-head p{margin:5px 0 0;color:var(--muted)}
.jobs-body{width:min(720px,100%);margin:auto;padding:18px}
.newjob{width:100%;padding:14px;background:var(--ink);color:var(--paper);border:0;font-weight:bold;margin-bottom:16px}
.job{background:var(--paper);border:1px solid #c6bead;padding:15px;margin-bottom:9px;box-shadow:0 2px 4px #0001}
.job strong{font-size:17px}.job small{display:block;color:var(--muted);margin-top:4px}.job button{margin-top:10px;border:1px solid #aaa18e;background:transparent;padding:8px 12px}
.back{border:0;background:transparent;padding:0;margin-bottom:12px;color:var(--muted)}
#book{background:#c8c2b4;flex-direction:column}
.book-toolbar{height:52px;flex:none;background:#252525;color:#eee;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-family:Arial,sans-serif}
.toolbtn{background:transparent;border:0;color:#fff;padding:9px 10px}.joblabel{font-size:13px;letter-spacing:.3px}.book-wrap{flex:1;display:flex;justify-content:center;overflow:auto;padding:0}
.page{position:relative;width:min(900px,100%);min-height:calc(100vh - 52px);background:var(--paper);box-shadow:0 0 18px #0003;padding:30px 28px 80px 70px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#b8c4ca 32px,#b8c4ca 33px)}
.page:before{content:"";position:absolute;left:48px;top:0;bottom:0;border-left:2px solid #c17a6e;opacity:.75}
.book-meta{font-size:13px;margin-bottom:18px;line-height:1.45;position:relative}.book-meta strong{font-size:20px}
.notes{position:relative}.note{min-height:33px;border-bottom:0;padding:5px 2px;display:flex;gap:12px;align-items:flex-start}.note-no{width:30px;text-align:right;color:#9a9181;font-size:11px;padding-top:3px}.note-text{font-size:16px;line-height:23px;white-space:pre-wrap}.note-type{font:10px Arial,sans-serif;color:#8d877c;margin-left:auto;padding-top:4px}
.empty-note{color:#aaa18f;font-style:italic;padding:20px 0}
.addbar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 30px));display:flex;gap:8px;z-index:5}
.addbar button{flex:1;padding:13px;border:1px solid #777064;background:#292929;color:#fff;box-shadow:0 4px 10px #0003}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:center;justify-content:center;padding:15px;font-family:Arial,sans-serif}.modal.show{display:flex}
.dialog{width:min(480px,100%);background:var(--paper);padding:22px;box-shadow:0 12px 35px #0006}.dialog h2{margin:0 0 18px;font-family:Georgia,serif}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:bold;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #aaa18d;background:#fffdf7}.actions{display:flex;gap:8px;margin-top:20px}.actions button{flex:1;padding:12px;border:1px solid #aaa18d;background:transparent}.actions .save{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:600px){.page{padding-left:55px;padding-right:16px}.page:before{left:37px}.book-toolbar{height:48px}.page{min-height:calc(100vh - 48px)}.title{font-size:37px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
  <div class="cover">
    <h1 class="title">Field Book</h1>
    <p class="subtitle">Digital field notes for survey work</p>
    <button class="cover-btn primary" onclick="newJob()">＋ Create New Job</button>
    <button class="cover-btn" onclick="showJobs()">▣ Job Storage</button>
    <div class="cover-footer">Prototype v0.0.2</div>
  </div>
</section>

<section id="jobs" class="screen">
  <div class="jobs-head">
    <button class="back" onclick="home()">← Back</button>
    <h1>Job Storage</h1><p>Open an existing field book or start a new job.</p>
  </div>
  <div class="jobs-body">
    <button class="newjob" onclick="newJob()">＋ CREATE NEW JOB</button>
    <div id="jobList"></div>
  </div>
</section>

<section id="book" class="screen">
  <div class="book-toolbar">
    <button class="toolbtn" onclick="showJobs()">☰ Jobs</button>
    <span class="joblabel" id="toolbarJob"></span>
    <button class="toolbtn" onclick="jobDetails()">Info</button>
  </div>
  <div class="book-wrap">
    <main class="page">
      <div class="book-meta" id="bookMeta"></div>
      <div class="notes" id="notes"></div>
    </main>
  </div>
  <div class="addbar">
    <button onclick="addNote()">＋ Field Note</button>
  </div>
</section>
</div>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>

<script>
const KEY='fieldBook.v002';
let db=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"active":null}');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function home(){screen('home')}
function showJobs(){renderJobs();screen('jobs')}
function nextJob(){let nums=db.jobs.map(j=>parseInt(String(j.number).split('-').pop())).filter(Number.isFinite);return '26-'+String((Math.max(0,...nums)+1)).padStart(4,'0')}
function newJob(){
 dialog.innerHTML=`<h2>New Job</h2>
 <div class="field"><label>JOB NUMBER</label><input id="jn" value="${nextJob()}"></div>
 <div class="field"><label>JOB NAME</label><input id="jname" placeholder="e.g. Boundary Survey"></div>
 <div class="field"><label>SITE / ADDRESS</label><input id="jsite" placeholder="Optional"></div>
 <div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="createJob()">Create Job</button></div>`;
 openModal()
}
function createJob(){let j={id:uid(),number:jn.value.trim()||nextJob(),name:jname.value.trim()||'Untitled Survey',site:jsite.value.trim(),created:new Date().toISOString(),notes:[]};db.jobs.unshift(j);db.active=j.id;save();closeModal();openBook()}
function renderJobs(){jobList.innerHTML=db.jobs.map(j=>`<div class="job"><strong>${esc(j.number)} — ${esc(j.name)}</strong><small>${esc(j.site||'No site entered')} · ${j.notes.length} field note${j.notes.length===1?'':'s'}</small><button onclick="openBook('${j.id}')">Open Field Book →</button></div>`).join('')||'<div style="padding:30px;text-align:center;color:#777">No jobs stored yet.</div>'}
function openBook(id){if(id)db.active=id;save();renderBook();screen('book')}
function active(){return db.jobs.find(j=>j.id===db.active)}
function renderBook(){let j=active();if(!j)return home();toolbarJob.textContent=j.number;bookMeta.innerHTML=`<strong>${esc(j.name)}</strong><br>${esc(j.site||'No site entered')}<br><span style="color:#777">${new Date(j.created).toLocaleDateString('en-AU')}</span>`;notes.innerHTML=j.notes.map((n,i)=>`<div class="note"><span class="note-no">${String(i+1).padStart(2,'0')}</span><span class="note-text">${esc(n.text)}</span><span class="note-type">${esc(n.type)}</span></div>`).join('')||'<div class="empty-note">Field notes will appear here…</div>'}
function addNote(){dialog.innerHTML=`<h2>Field Note</h2><div class="field"><label>NOTE</label><input id="nt" autofocus placeholder="Enter field observation…"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="saveNote()">Add Note</button></div>`;openModal();setTimeout(()=>nt.focus(),50)}
function saveNote(){let j=active(),v=nt.value.trim();if(!v)return; j.notes.push({id:uid(),text:v,type:'NOTE',time:new Date().toISOString()});save();closeModal();renderBook()}
function jobDetails(){let j=active();dialog.innerHTML=`<h2>${esc(j.number)}</h2><div class="field"><label>JOB NAME</label><input id="dn" value="${esc(j.name)}"></div><div class="field"><label>SITE</label><input id="ds" value="${esc(j.site)}"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="save" onclick="saveDetails()">Save</button></div>`;openModal()}
function saveDetails(){let j=active();j.name=dn.value.trim()||'Untitled Survey';j.site=ds.value.trim();save();closeModal();renderBook()}
function openModal(){modal.classList.add('show')};function closeModal(){modal.classList.remove('show')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()})
if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      // Force the browser to check GitHub for a fresh service worker on every app launch.
      await reg.update();
    }catch(e){}
  });
}
renderJobs();
</script>
</body>
</html>
